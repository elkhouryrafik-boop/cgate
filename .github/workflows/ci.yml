name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: python -m pip install -e ".[dev,serve]"
      - name: Lint
        run: ruff check .
      - name: Tests (node checks run, not skipped)
        run: python -m pytest -q
      - name: Demo
        run: python -m cgate demo --out out/ci
